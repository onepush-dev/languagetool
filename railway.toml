# LanguageTool 6.8 (grammar, style and spell checking HTTP API) on Railway. One service, no volume.
[build]
image = "erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527"

[deploy]
# The image has no ENTRYPOINT (CMD is `bash start.sh`), so the start command ends by running upstream's
# own /LanguageTool/start.sh (which writes langtool_* variables into config.properties and execs java).
# Before that it handles the optional n-gram data (NGRAM_LANGUAGES, off by default):
#   - downloads the requested languages into a /ngrams volume in the background and restarts once they
#     are unpacked, so the API keeps serving during the multi-GB download;
#   - sets languageModel=/ngrams only when n-gram data is actually present;
#   - starts as root (RAILWAY_RUN_UID=0) only to own the volume, then drops to the image's
#     unprivileged `languagetool` user with su. Without a volume nothing is written anywhere.
# Readable version: railway/start.sh
startCommand = "/bin/bash -c 'cd /LanguageTool; N=/ngrams; U=https://languagetool.org/download/ngram-data; ROOT=0; [ \"$(id -u)\" = 0 ] && ROOT=1; [ $ROOT = 1 ] && [ -d $N ] && chown languagetool:languagetool $N; JOBS=\"\"; for l in $(echo \"${NGRAM_LANGUAGES:-none}\" | tr \"A-Z,\" \"a-z \"); do case $l in none|off|false) continue ;; en) f=ngrams-en-20150817.zip ;; de) f=ngrams-de-20150819.zip ;; es) f=ngrams-es-20150915.zip ;; fr) f=ngrams-fr-20150913.zip ;; nl) f=ngrams-nl-20181229.zip ;; *) echo \"ngrams: unknown language $l (choose from en,de,es,fr,nl)\" >&2; continue ;; esac; if [ -d $N/$l ]; then echo \"ngrams: $l already on the volume\"; elif [ -d $N ] && [ -w $N ]; then JOBS=\"$JOBS $l:$f\"; else echo \"ngrams: $l requested but $N is not a writable volume; add a volume at $N (see README)\" >&2; fi; done; if [ -n \"$JOBS\" ]; then P=$$; ( NEW=0; for j in $JOBS; do l=${j%%:*}; f=${j#*:}; echo \"ngrams: downloading $f in the background (LanguageTool keeps serving meanwhile)\"; rm -rf $N/.$l.zip $N/.$l.tmp; if curl -fsSL --retry 5 -o $N/.$l.zip $U/$f && unzip -q -o $N/.$l.zip -d $N/.$l.tmp && [ -d $N/.$l.tmp/$l ]; then mv $N/.$l.tmp/$l $N/$l; rm -rf $N/.$l.zip $N/.$l.tmp; [ $ROOT = 1 ] && chown -R languagetool:languagetool $N/$l; echo \"ngrams: $l installed\"; NEW=1; else echo \"ngrams: $l download or unzip failed (check free space on the volume)\" >&2; rm -rf $N/.$l.zip $N/.$l.tmp; fi; done; if [ $NEW = 1 ]; then echo \"ngrams: restarting so LanguageTool loads the new data\"; kill $P; fi; ) & fi; if [ -z \"$langtool_languageModel\" ]; then for l in en de es fr nl; do [ -d $N/$l ] && export langtool_languageModel=$N && break; done; fi; [ -n \"$langtool_languageModel\" ] && echo \"ngrams: languageModel=$langtool_languageModel\"; if [ $ROOT = 1 ]; then exec su languagetool -s /bin/sh -c \"echo \\\"running LanguageTool as \\$(id -un)\\\"; exec bash start.sh\"; fi; exec bash start.sh'"
# /v2/languages answers 200 as soon as the HTTP server is up (a few seconds).
healthcheckPath = "/v2/languages"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
